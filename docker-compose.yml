# Local development database. Not intended for production use.
# MariaDB, to match Hostinger's managed "MySQL" databases.
services:
  db:
    image: mariadb:11.4
    container_name: cora-mysql
    restart: unless-stopped
    environment:
      MARIADB_USER: cora
      MARIADB_PASSWORD: cora_dev_password
      MARIADB_DATABASE: cora
      MARIADB_ROOT_PASSWORD: cora_root_password
    ports:
      - "3307:3306"
    volumes:
      - cora-mysql-data:/var/lib/mysql
      - ./docker/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql:ro
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  cora-mysql-data:
